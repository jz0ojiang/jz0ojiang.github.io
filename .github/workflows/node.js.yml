# 该workflow的名称，可以随意填写
name: Build And Deploy To Github Pages

# workflow的触发事件，这里代表main分支的push事件触发
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch for the workflow'
        required: true
        default: 'main'
  push:
    branches: [ v2 ]

# 任务
jobs:
  # build-and-deploy 为任务的ID
  build-and-deploy:
    # 运行所需要的环境
    runs-on: ubuntu-latest 
    # 发布到 gh-pages 用 workflow 自带的 GITHUB_TOKEN，要给它写仓库内容的权限
    permissions:
      contents: write

    steps:
      # 步骤名
      - name: Checkout
        # 使用的actions脚本，这里是官方提供的获取源码脚本
        uses: actions/checkout@v4
        # 这个为使用 JamesIves/github-pages-deploy-action脚本所需要的配置
        with:
          persist-credentials: false

      # 执行npm脚本打包项目
      - name: pnpm-setup
        uses: pnpm/action-setup@v3
        with:
          # 和 pnpm-lock.yaml 的 lockfileVersion 9.0 对齐。版本对不上时 pnpm 会忽略 lockfile 重新解析，
          # 装到更新的 vue，老的 vue-tsc 0.38 类型检查就过不去
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      
      # 执行JamesIves/github-pages-deploy-action将项目发布到Github Pages
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 发布到的分支
          branch: gh-pages
          # 要发布的文件夹
          folder: dist
